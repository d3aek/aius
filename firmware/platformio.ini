; Aius capability firmware — Teensy 4.1 target.
;
; Native host tests run via scripts/test.sh (plain gcc), not PlatformIO, so the
; portable C code is testable without the toolchain. This env is the Teensy
; cross-build; exact package/version pinning for a reproducible binary is
; hardened at capability-gate P4.

[env:teensy41-release]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
upload_protocol = teensy-cli
build_flags =
    -O2
    -std=gnu++17
    -Ilib/aius_codec_api/include
