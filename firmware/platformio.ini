; Aius capability firmware — Teensy 4.1 target (capability-gate P4).
;
; Native host tests run via scripts/test.sh (plain gcc), not PlatformIO, so the
; portable C code is testable without the toolchain. These envs are the Teensy
; cross-build; scripts/build.sh wraps `pio run` + the per-bank memory report.
;
; The portable codec sources live under lib/ and the vendored dcadec core under
; vendor/, but neither carries a PlatformIO library.json (those trees are owned by
; earlier phases and stay verbatim). The build is therefore driven entirely from
; here: build_src_filter reaches out to compile the exact source set the host
; `dts` suite compiles. `lib_ldf_mode = off` stops PlatformIO from ALSO
; auto-discovering and compiling lib/ as libraries (which would duplicate every
; symbol) — the explicit build_src_filter set is the single source of truth.
;
; Pins for a reproducible binary: PlatformIO Core 6.1.16, platform teensy@5.2.0
; (Teensyduino + arm-none-eabi-gcc pulled in by the platform). Record the toolchain
; version from `scripts/build.sh` output.

[common]
platform = teensy@5.2.0
board = teensy41
framework = arduino
extra_scripts =
    pre:scripts/build_metadata.py
    pre:scripts/build_config.py
    post:test/network-transport/verify_target.py
    post:test/boot-target/verify_target.py
    post:test/itcm-placement/verify_target.py
board_build.f_cpu = 600000000L
upload_protocol = teensy-cli

; Do not auto-compile lib/ as PlatformIO libraries; the explicit build_src_filter
; below is the single source of truth for what gets compiled. LDF off is what makes
; the default lib_dir safe here (no library auto-discovery, so no duplicate symbols).
lib_ldf_mode = off

; Compile main.cpp + the portable codec libs + the vendored dcadec core. Paths are
; relative to src_dir; `../` reaches the sibling lib/ and vendor/ trees. This is
; the same 11-source set the host `dts` suite links (adapter + shim + arena + 8
; vendored core .c files) plus the firmware entry point.
build_src_filter =
    +<*>
    +<../lib/aius_codec_api/src/aius_arena.c>
    +<../lib/aius_dts/src/aius_dts.c>
    +<../lib/aius_dts/src/aius_alloc_shim.c>
    +<../vendor/dcadec-core/bitstream.c>
    +<../vendor/dcadec-core/core_decoder.c>
    +<../vendor/dcadec-core/dmix_tables.c>
    +<../vendor/dcadec-core/idct_fixed.c>
    +<../vendor/dcadec-core/idct_float.c>
    +<../vendor/dcadec-core/interpolator.c>
    +<../vendor/dcadec-core/interpolator_fixed.c>
    +<../vendor/dcadec-core/ta.c>

; -Os is the platform default; force -O2 for the 600 MHz release measurement.
build_unflags = -Os

; The vendored core accommodations (see vendor/dcadec-core/NOTICE.md) live in flags,
; never in edits: -D_GNU_SOURCE for M_PI in idct_float.c, -Wno-expansion-to-defined
; for the AT_LEAST_GCC() feature macro. The --wrap set routes ta.c's libc calls
; through the AiusArena when one is armed (the no-heap path), exactly as the host
; DTS suites do. Include paths cover the codec ABI, adapter, parser, and core.
build_flags =
    -O2
    -std=gnu++17
    -D_GNU_SOURCE
    ; The DSP's contract is that host and target produce bit-identical output, and
    ; scripts/test.sh passes this flag for every dsp suite. It was missing here
    ; until 2026-07-26, and GCC defaults to -ffp-contract=fast, so the target was
    ; emitting 25 vfma.f64 in truepeak_push, run_cascade, aius_dsp_downmix and
    ; aius_dsp_limiter_run where the host emits separate vmul/vadd. The downmix
    ; and EQ therefore were NOT bit-identical to the host despite the claim. A
    ; fused multiply-add keeps full intermediate precision, so it does not merely
    ; round differently -- it rounds *once* where the host rounds twice.
    ; Do not remove: it is the flag that makes every dsp golden vector mean
    ; something about this image rather than only about the host.
    -ffp-contract=off
    -Wno-expansion-to-defined
    -Ilib/aius_codec_api/include
    -Ilib/aius_dts/include
    -Ilib/aius_iec61937/include
    -Ilib/aius_capability/include
    -Ivendor/dcadec-core
    -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free

[env:teensy41-release]
extends = common

[env:teensy41-instrument]
extends = common
; Same footprint, plus debug symbols retained for map inspection / later DWT cycle
; instrumentation (gate P6). Kept as a distinct binary so the release .elf stays
; measurement-clean.
build_flags =
    ${common.build_flags}
    -g
    -DAIUS_INSTRUMENT=1

[env:teensy41-capability]
extends = common
; P6 uses the Teensy RawHID interface exposed as /dev/hidraw*. The portable
; capability handler is unchanged; only this transport entry point differs.
board_build.usb_type = rawhid
build_flags =
    ${common.build_flags}
    -DUSB_RAWHID
build_src_filter =
    ${common.build_src_filter}
    -<main.cpp>
    -<optical_main.cpp>
    +<capability_main.cpp>
    +<../lib/aius_capability/src/aius_cap_protocol.c>
    +<../lib/aius_capability/src/aius_cap_payload.c>
    +<../lib/aius_capability/src/aius_cap_device.c>

[env:teensy41-optical]
extends = common
; Ethernet bring-up target. USB remains the programming fallback; the runtime
; service is reachable through NativeEthernet after the board leaves USB.
; Resolve the repository snapshot explicitly under its Aius-specific library
; name, and reject the same-named NativeEthernet copy embedded in the framework.
lib_deps = symlink://vendor/NativeEthernet
lib_ldf_mode = chain+
lib_ignore = Audio, SerialFlash, NativeEthernet, aius_audio, aius_net, aius_http, aius_sd, aius_runtime
; aius_optical_app.cpp and the aius_runtime_* / aius_cdc_teensy composition are
; the live runtime as of the Phase 14 cutover: optical_main.cpp's setup()
; constructs AiusRuntimeTeensy and loop() drives one epoch of it, so every
; module below is linked and reachable rather than dropped by --gc-sections.
; The [common] post-link hooks are what keep that honest -- the retained-slot
; proof, the pinned-NativeEthernet proof, and the two ITCM placement checks
; (cold objects emit no ITCM; optical_main.cpp emits only its pinned
; audio-block set). `scripts/test.sh --suite itcm-placement` re-runs the last
; of those over an existing build.
build_src_filter =
    +<optical_main.cpp>
    +<aius_optical_app.cpp>
    +<aius_cdc_teensy.cpp>
    +<aius_runtime_network_http.cpp>
    +<aius_runtime_storage.cpp>
    +<aius_runtime_usb.cpp>
    +<aius_runtime_teensy.cpp>
    +<aius_boot_teensy.cpp>
    +<aius_fault_teensy.cpp>
    +<aius_network_teensy.cpp>
    +<aius_sd_teensy.cpp>
    +<../lib/aius_boot/src/aius_boot.c>
    +<../lib/aius_audio/src/aius_spdif_sources.cpp>
    +<../lib/aius_audio/src/aius_audio_clock.cpp>
    +<../lib/aius_net/src/aius_net.c>
    +<../lib/aius_http/src/aius_http.c>
    +<../lib/aius_http/src/aius_http_transaction.c>
    +<../lib/aius_sd/src/aius_sd.c>
    +<../lib/aius_runtime/src/aius_runtime.c>
    +<../lib/aius_pipeline/src/aius_pipeline.c>
    +<../lib/aius_iec61937/src/aius_iec61937.c>
    +<../lib/aius_dsp/src/aius_dsp.c>
    +<../lib/aius_replay/src/aius_replay.c>
    +<../vendor/dcadec-core/bitstream.c>
    +<../vendor/dcadec-core/core_decoder.c>
    +<../vendor/dcadec-core/dmix_tables.c>
    +<../vendor/dcadec-core/idct_fixed.c>
    +<../vendor/dcadec-core/idct_float.c>
    +<../vendor/dcadec-core/interpolator.c>
    +<../vendor/dcadec-core/interpolator_fixed.c>
    +<../vendor/dcadec-core/ta.c>
build_flags =
    ${common.build_flags}
; THE ENGINE CLOCK. AudioStream.h defaults AUDIO_SAMPLE_RATE_EXACT to 44100.0f
; behind an #ifndef (cores/teensy4/AudioStream.h:57), and every other rate in
; this firmware -- the decoded DTS block, the PCM passthrough tag, the DSP
; config, the replay seam's 192,000 B/s -- is 48 kHz. Left at the default the
; transmitter clocked 48 kHz material out at 44.1 kHz: 8.1 % slow, ~1.4
; semitones flat, and invisible to every counter because producer and consumer
; both ran off that same wrong clock. This is the one place the output clock is
; chosen. optical_main.cpp static_asserts it against AIUS_OPTICAL_SAMPLE_RATE_HZ
; so the two can never drift apart again silently.
;
; config_spdif3() derives the whole tx clock tree from it and 48 kHz divides
; exactly: PLL4 = 24 MHz * 28.672 = 688.128 MHz, SPDIF0_CLK_ROOT = /8 =
; 86.016 MHz, TXCLK_DF = 27 gives 86.016 MHz / 28 = 3.072 MHz = 64 * 48,000
; with zero remainder. No fractional-divider error to hear.
    -DAUDIO_SAMPLE_RATE_EXACT=48000.0f
    -Ilib/aius_net/include
    -Ilib/aius_http/include
    -Ilib/aius_sd/include
    -Ilib/aius_boot/include
    -Ilib/aius_runtime/include
    -Ilib/aius_audio/include
    -Ilib/aius_pipeline/include
    -Ilib/aius_iec61937/include
    -Ilib/aius_dsp/include
    -Ilib/aius_dsp_config/include
    -Ilib/aius_replay/include
    -Ivendor/dcadec-core
    -I${platformio.packages_dir}/framework-arduinoteensy/libraries/Audio
    -Wl,--undefined=g_aius_boot_slots
build_unflags =
    -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free

[env:teensy41-optical-fault]
extends = env:teensy41-optical
; Identical to the production image except that build_metadata.py turns the
; AIUS_FAULT_CHECKPOINT environment variable into an AIUS_FAULT_STALL_CHECKPOINT
; define, which makes aius_fault_teensy.cpp stall forever the first time the
; runtime reaches that checkpoint. Select it through
; `scripts/build.sh teensy41-optical-fault <0..8>`, never by exporting the
; variable yourself; the production image leaves the define undefined and
; aius_fault_checkpoint() compiles to a return.
