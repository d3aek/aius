# Build the Aius site (site/) from this repository and deploy it to GitHub Pages.
# Runs on the public repository only: it reads nothing but the published tree and
# deploys with the workflow's own Pages permission, so no token is involved.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The anonymised mirror repository has Actions enabled and no other workflow
    # folder, so its host reads this file too; build only on GitHub.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node site/build.mjs --out _site
      # Links only: the forbidden-literal list is not part of the published tree.
      - run: node site/check.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
